site_name: Market Strategy Engine
site_description: Strategic capability gap analysis for competitive market intelligence
site_author: Grokify
site_url: https://grokify.github.io/market-strategy-engine/

repo_name: grokify/market-strategy-engine
repo_url: https://github.com/grokify/market-strategy-engine

theme:
  name: material
  palette:
    - scheme: slate
      primary: indigo
      accent: purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: indigo
      accent: purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - content.code.copy

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Quick Start: getting-started/quickstart.md
    - Your First Analysis: getting-started/first-analysis.md
  - Concepts:
    - Overview: concepts/overview.md
    - Data Model: concepts/data-model.md
    - Gap Analysis: concepts/gap-analysis.md
    - Readiness Scoring: concepts/readiness.md
    - Multi-Market Analysis: concepts/multi-market.md
  - CLI Reference:
    - Commands: cli/commands.md
    - analyze: cli/analyze.md
    - multimarket: cli/multimarket.md
    - validate: cli/validate.md
  - Examples:
    - CRM Market: examples/crm-market.md
  - Releases:
    - v0.1.0: releases/v0.1.0.md
  - Development:
    - Contributing: development/contributing.md
    - Roadmap: specs/ROADMAP.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/grokify/market-strategy-engine
